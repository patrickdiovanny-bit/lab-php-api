<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contato</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 520px; margin: 24px auto; padding: 0 16px; }
  label, input, textarea { display: block; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 16px; }
  button { padding: 10px 18px; font-size: 16px; }
  #resposta { margin-top: 14px; padding: 10px; background: #EAF2FB; border-radius: 8px; min-height: 24px; }
</style>
</head>
<body>
<h1>Contato</h1>
<form id="form">
  <label for="nome">Nome</label>
  <input id="nome" name="nome" type="text">
  <label for="mensagem">Mensagem</label>
  <textarea id="mensagem" name="mensagem" rows="3"></textarea>
  <button type="submit">Enviar</button>
</form>
<div id="resposta"></div>
<p><a href="index.html">Voltar à vitrine</a></p>
<script src="js/contato.js"></script>
</body>
</html>
